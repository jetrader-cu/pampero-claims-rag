services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    container_name: pampero-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pampero}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pampero}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8.8.4
    container_name: pampero-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-63799}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  otel-lgtm:
    image: grafana/otel-lgtm:0.39.0
    container_name: pampero-otel-lgtm
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    ports:
      - "3000:3000"     # Grafana UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    volumes:
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pampero-migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL_OWNER: "postgresql+psycopg://postgres:postgres@db:5432/pampero"
      DATABASE_SYNC_URL: "postgresql+psycopg://postgres:postgres@db:5432/pampero"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pampero-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://pampero_app:pampero_app_secret@db:5432/pampero"
      DATABASE_SYNC_URL: "postgresql+psycopg://pampero_app:pampero_app_secret@db:5432/pampero"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      STORAGE_PATH: "/app/data/uploads"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-pampero-dev-admin-token}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-pampero-default-pepper-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4317"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/data/uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pampero-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "INFO", "-c", "2", "-Q", "celery"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://pampero_app:pampero_app_secret@db:5432/pampero"
      DATABASE_SYNC_URL: "postgresql+psycopg://pampero_app:pampero_app_secret@db:5432/pampero"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      STORAGE_PATH: "/app/data/uploads"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-pampero-dev-admin-token}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-pampero-default-pepper-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4317"
    volumes:
      - ./backend/data/uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pampero-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "INFO"]
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/0"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pampero-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pampero_storage:
